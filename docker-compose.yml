services:
  calls:
    build: .
    environment:
      APP_NAME: ${APP_NAME:-xam_call_service}
      DEBUG: ${DEBUG:-false}

      AUTH_MODE: ${AUTH_MODE:-jwt}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me-32-bytes-min}
      JWT_ALGORITHMS: ${JWT_ALGORITHMS:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      OAUTH2_JWKS_URL: ${OAUTH2_JWKS_URL:-}
      OAUTH2_INTROSPECTION_URL: ${OAUTH2_INTROSPECTION_URL:-}
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID:-}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET:-}
      AUTH_ENRICH_USERINFO: ${AUTH_ENRICH_USERINFO:-true}
      USERINFO_CACHE_TTL_SECONDS: ${USERINFO_CACHE_TTL_SECONDS:-300}

      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://host.docker.internal:8000}
      BACKEND_USERINFO_PATH: ${BACKEND_USERINFO_PATH:-/api/v1/users/me}
      BACKEND_TIMEOUT_SECONDS: ${BACKEND_TIMEOUT_SECONDS:-5}

      DATABASE_URL: sqlite+aiosqlite:////app/data/calls.db
      AUTO_CREATE_TABLES: "true"

      RING_TIMEOUT_SECONDS: ${RING_TIMEOUT_SECONDS:-45}
      DISCONNECT_GRACE_SECONDS: ${DISCONNECT_GRACE_SECONDS:-10}
      MAX_CALL_DURATION_SECONDS: ${MAX_CALL_DURATION_SECONDS:-14400}
      WS_TICKET_TTL_SECONDS: ${WS_TICKET_TTL_SECONDS:-30}
      MAX_WS_MESSAGE_BYTES: ${MAX_WS_MESSAGE_BYTES:-98304}
      WS_IDLE_TIMEOUT_SECONDS: ${WS_IDLE_TIMEOUT_SECONDS:-180}
      WS_SEND_TIMEOUT_SECONDS: ${WS_SEND_TIMEOUT_SECONDS:-5}

      ICE_SERVERS: '${ICE_SERVERS:-[{"urls":["stun:stun.l.google.com:19302"]}]}'
      TURN_URLS: ${TURN_URLS:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080,http://localhost:8081,http://127.0.0.1:8081}
    volumes:
      - calls_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CALLS_PORT:-8081}:8081"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # STUN/TURN for WebRTC media. Without a reachable TURN server calls fail
  # whenever both peers are behind symmetric NAT / CGNAT (connectionState=failed).
  # TURN_EXTERNAL_IP must be the address clients use to reach this host: the LAN
  # IP for local calls or the public IP with 3478/tcp, 3478/udp and the relay
  # range forwarded on the router for calls over the internet.
  turn:
    image: coturn/coturn:4.6.3
    command:
      - --log-file=stdout
      - --listening-ip=0.0.0.0
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:-xam}
      - --user=${TURN_USERNAME:-xam}:${TURN_CREDENTIAL:-xam-turn-change-me}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49200}
      - --no-tls
      - --no-dtls
      - --no-cli
      - --no-multicast-peers
      - --no-software-attribute
      - --stale-nonce=600
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}/udp"
    restart: unless-stopped

  # Same service behind HTTPS with a self-signed certificate (for camera/mic
  # access over LAN, where getUserMedia requires a secure context).
  calls-tls:
    build: ./deploy/nginx
    depends_on:
      calls:
        condition: service_healthy
    environment:
      TLS_HOSTS: ${TLS_HOSTS:-localhost,127.0.0.1}
      TLS_CN: ${TLS_CN:-localhost}
      TLS_CERT_DAYS: ${TLS_CERT_DAYS:-825}
      TLS_REGENERATE: ${TLS_REGENERATE:-0}
    volumes:
      - calls_tls_certs:/etc/nginx/certs
    ports:
      - "${CALLS_TLS_PORT:-8443}:443"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-check-certificate -q -O /dev/null https://127.0.0.1/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  calls_data:
  calls_tls_certs:
